- insert:
    - id: dsh-session-menu
      name: 'dsh-session-menu'
      # 「打开方式」的应用清单。不写就用 index.js 的 DEFAULT_DEVELOPER_APPS（IDE → AI 助手 → 终端）。
      # kind 只影响可读性（editor / ai / terminal 都行）；paths 是同一项的候选 .app 绝对路径，
      # 命中第一个存在的就把那一项列进菜单。
      # ⚠️ config 是**整体替换**，不是追加：取消注释后，想要的每一项都得写上。
